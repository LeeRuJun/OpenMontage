name: historical-story
version: "1.2"
description: >
  Fact-grounded historical storytelling pipeline. Designs how the story is told first,
  writes and locks narration, then derives storyboard requirements before designing
  characters and scenes, generating core assets, and producing final shot images.
category: custom
stability: beta
default_checkpoint_policy: guided
production_modes:
  - name: pilot_2min
    description: "90-150 second validation cut; target ~120 seconds and ~480-576 Chinese characters at 4.0-4.8 chars/second."
    required_tools: [tts_selector]
    optional_tools: [image_selector]
    scene_type: historical_story
    visual_plan:
      final_visual_boards: {min: 6, max: 12, recommended: 8}
      boards_per_act: {min: 2, max: 4, recommended: 3}
      board_duration_seconds: {min: 8, max: 24, preferred_max: 18}
      microbeats_per_board: {min: 2, max: 4, recommended: 3}
      microbeat_duration_seconds: {min: 3, max: 8}
  - name: full_longform
    description: "22-25 minute historical story; target 5,500-7,200 Chinese characters at 4.0-4.8 chars/second, 40-50 final visual boards across 8-10 acts, with 3-5 internal microbeats per board."
    required_tools: [tts_selector]
    optional_tools: [image_selector]
    scene_type: historical_story
    visual_plan:
      final_visual_boards: {min: 40, max: 50, recommended: 48}
      boards_per_act: {min: 5, max: 7, recommended: 6}
      board_duration_seconds: {min: 20, max: 36, preferred_max: 30}
      microbeats_per_board: {min: 3, max: 5, recommended: 4}
      microbeat_duration_seconds: {min: 4, max: 8}
orchestration:
  mode: executive-producer
  skill: pipelines/historical-story/executive-producer
  budget_default_usd: 3.00
  max_revisions_per_stage: 2
  max_send_backs: 2
  max_wall_time_minutes: 60
extensions:
  custom_scripts: true
  custom_playbooks: true
  custom_skills: true
  custom_tools: false
required_skills:
  - pipelines/historical-story/executive-producer
  - pipelines/historical-story/intake-director
  - pipelines/historical-story/research-director
  - pipelines/historical-story/story-design-director
  - pipelines/historical-story/cover-plan-director
  - pipelines/historical-story/proposal-director
  - pipelines/historical-story/script-director
  - pipelines/historical-story/narration-timing-director
  - pipelines/historical-story/scene-director
  - pipelines/historical-story/character-bible-director
  - pipelines/historical-story/scene-bible-director
  - pipelines/historical-story/asset-director
  - pipelines/historical-story/shot-asset-plan-director
  - pipelines/historical-story/edit-director
  - pipelines/historical-story/compose-director
  - pipelines/historical-story/publish-director
  - meta/reviewer
  - meta/checkpoint-protocol
  - meta/voice-performance-director
stages:
  - name: intake
    skill: pipelines/historical-story/intake-director
    produces: [brief]
    checkpoint_required: true
    human_approval_default: true
  - name: research
    skill: pipelines/historical-story/research-director
    required_artifacts_in: [brief]
    produces: [research_brief, historical_evidence_ledger]
    checkpoint_required: true
    human_approval_default: true
  - name: story_design
    skill: pipelines/historical-story/story-design-director
    required_artifacts_in: [brief, research_brief, historical_evidence_ledger]
    produces: [story_spine]
    checkpoint_required: true
    human_approval_default: true
  - name: cover_plan
    skill: pipelines/historical-story/cover-plan-director
    required_artifacts_in: [brief, research_brief, historical_evidence_ledger, story_spine]
    produces: [cover_plan]
    checkpoint_required: true
    human_approval_default: true
  - name: proposal
    skill: pipelines/historical-story/proposal-director
    required_artifacts_in: [brief, research_brief, historical_evidence_ledger, story_spine, cover_plan]
    produces: [proposal_packet, decision_log]
    checkpoint_required: true
    human_approval_default: true
  - name: script
    skill: pipelines/historical-story/script-director
    required_artifacts_in: [proposal_packet, story_spine, historical_evidence_ledger]
    produces: [script]
    checkpoint_required: true
    human_approval_default: true
  - name: narration_timing
    skill: pipelines/historical-story/narration-timing-director
    required_artifacts_in: [script]
    produces: [narration_timing]
    required_tools: [tts_selector]
    tools_available: [tts_selector, transcriber]
    checkpoint_required: true
    human_approval_default: true
  - name: storyboard_blueprint
    skill: pipelines/historical-story/scene-director
    required_artifacts_in: [script, narration_timing, story_spine]
    produces: [scene_plan]
    checkpoint_required: true
    human_approval_default: true
  - name: character_bible
    skill: pipelines/historical-story/character-bible-director
    required_artifacts_in: [script, scene_plan, historical_evidence_ledger]
    produces: [historical_character_bible]
    checkpoint_required: true
    human_approval_default: true
  - name: scene_bible
    skill: pipelines/historical-story/scene-bible-director
    required_artifacts_in: [script, scene_plan, historical_evidence_ledger]
    produces: [historical_scene_bible]
    checkpoint_required: true
    human_approval_default: true
  - name: core_assets
    skill: pipelines/historical-story/asset-director
    required_artifacts_in: [scene_plan, historical_character_bible, historical_scene_bible, historical_evidence_ledger]
    produces: [asset_manifest]
    required_tools: [image_selector]
    optional_tools: [music_gen]
    tools_available: [image_selector, music_gen]
    checkpoint_required: true
    human_approval_default: true
  - name: shot_asset_plan
    skill: pipelines/historical-story/shot-asset-plan-director
    required_artifacts_in: [scene_plan, historical_character_bible, historical_scene_bible, asset_manifest]
    produces: [shot_asset_plan]
    checkpoint_required: true
    human_approval_default: true
  - name: shot_assets
    skill: pipelines/historical-story/asset-director
    required_artifacts_in: [scene_plan, shot_asset_plan, historical_character_bible, historical_scene_bible, asset_manifest]
    produces: [asset_manifest]
    required_tools: [image_selector]
    tools_available: [image_selector]
    checkpoint_required: true
    human_approval_default: true
  - name: edit
    skill: pipelines/historical-story/edit-director
    required_artifacts_in: [scene_plan, asset_manifest, narration_timing, script]
    produces: [edit_decisions]
    checkpoint_required: true
    human_approval_default: true
  - name: compose
    skill: pipelines/historical-story/compose-director
    required_artifacts_in: [edit_decisions, asset_manifest, narration_timing]
    produces: [render_report, final_review]
    required_tools: [video_compose]
    optional_tools: [hyperframes_compose, audio_mixer]
    tools_available: [video_compose, hyperframes_compose, audio_mixer]
    checkpoint_required: true
    human_approval_default: false
  - name: publish
    skill: pipelines/historical-story/publish-director
    required_artifacts_in: [render_report, final_review, historical_evidence_ledger]
    produces: [publish_log]
    checkpoint_required: true
    human_approval_default: true
